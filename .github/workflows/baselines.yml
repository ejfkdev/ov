name: Baselines

# 基线回归: 对 testdata/baselines.json 的 32 条真实模板做探测回归
# (校验期望版本是否全部命中, 退出码 = 失败数)。每日定时 + 手动触发,
# 不阻塞发版(部分国内 CDN 从 GitHub 托管环境访问可能抖动)。

on:
  schedule:
    - cron: '23 3 * * *' # UTC 03:23 (北京时间 11:23)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build ov
        run: go build -o ov .

      - name: Run baselines
        run: testdata/run_baselines.sh ./ov