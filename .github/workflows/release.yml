name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build (最小化二进制)
        run: |
          ext=''
          [ "$GOOS" = windows ] && ext='.exe'
          name="ov-${GOOS}-${GOARCH}${ext}"
          echo "NAME=${name}" >> "$GITHUB_ENV"
          # -s -w: 去符号表与 DWARF 调试信息
          # -trimpath: 去编译路径; -buildvcs=false: 不嵌入 git 元数据
          # -buildid=: 清空构建 ID; CGO_ENABLED=0: 纯静态、无 libc 依赖
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X main.version=${GITHUB_REF_NAME#v}" \
            -o "$name" .

      - name: UPX compress (mac 与不支持的格式自动跳过)
        run: |
          case "$GOOS" in
            darwin)
              echo "UPX 不支持 macOS 二进制, 跳过压缩"
              exit 0
              ;;
          esac
          if upx --best --lzma "$NAME"; then
            echo "UPX 压缩完成"
          else
            echo "UPX 不支持 ${GOOS}/${GOARCH}, 保留未压缩二进制"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ov-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.NAME }}
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List binaries
        run: ls -lah dist/

      - name: Upload release assets (裸二进制, 不再打包)
        uses: softprops/action-gh-release@v3
        with:
          files: dist/ov-*
          generate_release_notes: true

  # 发布完成后立即触发 brew tap 与 scoop bucket 的自动更新(否则要等它们的每日定时任务)。
  # 需要仓库 secret PACKAGES_TOKEN: 一个对 ejfkdev/homebrew-tap 与 ejfkdev/scoop-bucket
  # 有 Actions 写权限的 fine-grained PAT(或 classic PAT, 需 repo+workflow scope)。
  # 未配置时本 job 跳过并给出说明, 不影响发版; 两个仓库仍会在每日定时任务中更新。
  packages:
    needs: release
    runs-on: ubuntu-latest
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Trigger Homebrew tap & Scoop bucket auto-update
        if: env.PACKAGES_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.PACKAGES_TOKEN }}
        run: |
          gh workflow run "Auto-update formulae" --repo ejfkdev/homebrew-tap
          gh workflow run "Auto-update manifests" --repo ejfkdev/scoop-bucket
          echo "已触发 brew/scoop 更新工作流"

      - name: Skip notice (PACKAGES_TOKEN 未配置)
        if: env.PACKAGES_TOKEN == ''
        run: echo "未配置 PACKAGES_TOKEN, 跳过 brew/scoop 即时更新; 它们会在每日定时任务中自动更新"