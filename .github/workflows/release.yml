name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos:
          - linux
          - windows
          - darwin
        goarch:
          - amd64
          - arm64
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext='${{ matrix.ext }}'
          name="ov-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$name" .
          upx -9 "$name"
          echo "$name" >> artifacts.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ov-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: ov-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          compression-level: 0
